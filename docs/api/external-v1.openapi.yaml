        enemyCount: { type: integer, minimum: 1, maximum: 6 }
        includeBoss: { type: boolean }
        includeHazards: { type: boolean }
        includeMinions: { type: boolean }
        terrain: { type: string }
        useLocationTheme: { type: boolean }
