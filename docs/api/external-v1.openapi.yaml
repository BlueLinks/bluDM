        preserveCombatantIds: { type: array, items: { type: string, format: uuid } }
        preserveCreatureIds: { type: array, items: { type: string } }
        replaceManagedCombatantsOnly: { type: boolean, default: true }
        requiredCreatureIds: { type: array, items: { type: string } }
        forbiddenCreatureIds: { type: array, items: { type: string } }
        allowedSourceKeys: { type: array, items: { type: string } }
        minimumEnemyBodies: { type: integer, minimum: 0, maximum: 6 }
        maximumEnemyBodies: { type: integer, minimum: 0, maximum: 6 }
      additionalProperties: false
      examples:
        - idempotencyKey: reroll-room-12-01
          expectedRevision: 1
          options: { archetype: beasts, challenge: medium, enemyCount: 3 }
          freshSeed: true
          preserveCombatantIds: [33333333-3333-4333-8333-333333333333]
          replaceManagedCombatantsOnly: true
