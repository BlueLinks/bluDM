      examples:
        - name: Gatehouse Omens
          category: encounter
          dieExpression: 1d4
          rows:
            - { minRoll: 1, maxRoll: 2, label: Ravens, resultText: Three ravens watch in silence. }
            - { minRoll: 3, maxRoll: 4, label: Bell, resultText: A buried bell sounds once. }
