    RestoreRevision:
      type: object
      required: [idempotencyKey, expectedRevision]
      properties:
        idempotencyKey: { type: string, minLength: 1 }
        expectedRevision: { type: integer, minimum: 1 }
      additionalProperties: false
      examples:
        - idempotencyKey: restore-room-12-revision-1
          expectedRevision: 3
    CampaignChanges:
      type: object
      required: [changes]
      properties:
        idempotencyKey: { type: string }
        previewToken: { type: string }
        changes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [operation, data]
            properties:
              operation: { enum: [create_location, create_npc, link_npc_to_location, create_location_link] }
              clientRef:
                type: string
                description: Unique name assigned to a create operation; later ID fields may use ref:<clientRef>.
              data: { type: object }
            additionalProperties: false
      additionalProperties: false
      examples:
        - changes:
            - operation: create_location
              clientRef: gatehouse
              data: { name: Broken Gatehouse, locationType: room }
            - operation: create_location
              clientRef: vault
              data: { name: Sunken Vault, locationType: room, parentLocationId: "ref:gatehouse" }
            - operation: create_location_link
              data:
                sourceLocationId: "ref:gatehouse"
                targetLocationId: "ref:vault"
                linkType: passage
    NPCCommand:
      type: object
