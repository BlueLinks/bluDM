<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>bluDM · Combat history mockups</title>
    <link rel="stylesheet" href="combat-history-mockups.css" />
    <script src="combat-history-mockups.js" defer></script>
  </head>
  <body>
    <svg class="icon-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-swords" viewBox="0 0 24 24">
        <path
          d="m14.5 3 3 3L6 17.5 3 14.5ZM3 3l3 0 15 15-3 3L3 6Zm12 16 4-4M5 9l4-4M2 22l4-4m12-12 4-4"
        />
      </symbol>
      <symbol id="i-list" viewBox="0 0 24 24">
        <rect x="5" y="4" width="14" height="17" rx="2" />
        <path d="M9 4V2h6v2M9 9h6m-6 4h6m-6 4h4" />
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" />
        <path d="M12 7v5l3 2" />
      </symbol>
      <symbol id="i-users" viewBox="0 0 24 24">
        <circle cx="9" cy="8" r="3" />
        <path d="M3 21v-3a6 6 0 0 1 12 0v3M16 5a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 5" />
      </symbol>
      <symbol id="i-book" viewBox="0 0 24 24">
        <path d="M12 5C8 2 3 3 2 4v15c3-2 7-1 10 1 3-2 7-3 10-1V4c-2-1-6-2-10 1Zm0 0v15" />
      </symbol>
      <symbol id="i-castle" viewBox="0 0 24 24">
        <path d="M3 21V8h4v4h3V5h4v7h3V8h4v13ZM3 8V4m4 4V4m10 4V4m4 4V4M10 21v-5h4v5" />
      </symbol>
      <symbol id="i-sparkles" viewBox="0 0 24 24">
        <path d="m12 3 3 6 6 3-6 3-3 6-3-6-6-3 6-3Zm7-2v4m-2-2h4" />
      </symbol>
      <symbol id="i-box" viewBox="0 0 24 24">
        <path d="m12 2 9 5v10l-9 5-9-5V7Zm0 10 9-5M12 12 3 7m9 5v10M7 4l10 6" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="10.5" cy="10.5" r="6.5" />
        <path d="m16 16 5 5" />
      </symbol>
      <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6" /></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5m6-6-6 6 6 6" /></symbol>
      <symbol id="i-heart" viewBox="0 0 24 24">
        <path
          d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8ZM9 11h6m-3-3v6"
        />
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5" />
      </symbol>
      <symbol id="i-moon" viewBox="0 0 24 24">
        <path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6" /></symbol>
    </svg>

    <div class="prototype-bar" aria-label="Prototype controls">
      <span class="prototype-label">HTML mockups <span>· Sample data</span></span>
      <nav class="preview-nav" aria-label="Mockup screens">
        <button type="button" data-screen="history">History</button>
        <button type="button" data-screen="report">Fight report</button>
        <button type="button" data-screen="timeline">Round log</button>
        <button type="button" data-screen="empty">Empty state</button>
      </nav>
      <div class="preview-appearance">
        <label class="sr-only" for="accent">Accent palette</label>
        <select id="accent">
          <option value="green">Forest</option>
          <option value="blue">Ocean</option>
          <option value="pink">Rose</option>
          <option value="red">Ember</option>
        </select>
        <button type="button" id="theme" class="icon-button" aria-label="Switch to dark theme">
          <svg class="icon"><use href="#i-moon" /></svg>
        </button>
      </div>
    </div>

    <div class="app-shell">
      <aside class="sidebar" aria-label="Application navigation">
        <div class="brand">
          <svg class="icon"><use href="#i-swords" /></svg><span>blu<strong>DM</strong></span>
        </div>
        <nav class="app-nav" aria-label="Main navigation">
          <span
            ><svg class="icon"><use href="#i-castle" /></svg><span>Campaigns</span></span
          >
          <span aria-current="page"
            ><svg class="icon"><use href="#i-list" /></svg><span>Encounters</span></span
          >
          <span
            ><svg class="icon"><use href="#i-users" /></svg><span>Players</span></span
          >
          <span
            ><svg class="icon"><use href="#i-swords" /></svg><span>NPCs</span></span
          >
          <span
            ><svg class="icon"><use href="#i-sparkles" /></svg><span>Spells</span></span
          >
          <span
            ><svg class="icon"><use href="#i-box" /></svg><span>Items</span></span
          >
          <span
            ><svg class="icon"><use href="#i-book" /></svg><span>Rules</span></span
          >
        </nav>
        <div class="sidebar-bottom">
          <span class="avatar">DM</span><span>Dungeon Master<small>My workspace</small></span>
        </div>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <span>Encounters <span class="muted">/ Return to Phandalin</span></span
          ><span class="topbar-context">DM workspace</span>
        </header>
        <main id="workspace-main">
          <div class="page-heading">
            <div>
              <p class="breadcrumb">Campaigns / Return to Phandalin</p>
              <h1>Encounters</h1>
              <p class="muted">Prepare the next fight. Revisit the ones you’ve played.</p>
            </div>
            <button type="button" class="button primary" id="prepared-shortcut">
              Prepared encounters
            </button>
          </div>
          <nav class="workspace-tabs" aria-label="Encounter views">
            <button type="button" data-workspace="prepared">
              Prepared encounters <span>12</span></button
            ><button type="button" data-workspace="history" aria-current="page">
              Combat history <span>3</span>
            </button>
          </nav>
          <div id="screen"></div>
        </main>
      </div>
    </div>
    <div class="toast" role="status" id="toast" hidden></div>
    <noscript
      ><p>
        This interactive mockup needs JavaScript. All data is fictional and stays in this page.
      </p></noscript
    >
  </body>
</html>
